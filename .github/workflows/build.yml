name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk eletvezerles-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eletvezerles-apk
          path: eletvezerles-${{ github.run_number }}.apk

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Életvezérlés – ${{ github.run_number }}. build
          body: Automatikus build a ${{ github.sha }} változatból. Telefonon nyisd meg ezt az oldalt, és töltsd le az APK-t.
          files: eletvezerles-${{ github.run_number }}.apk
          make_latest: true
