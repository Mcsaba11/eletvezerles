name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan ci-log && git rm -rfq --cached . && git add -f build.log
          git commit -qm "build log ${{ github.run_number }}" && git push -f origin ci-log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk eletvezerles-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eletvezerles-apk
          path: eletvezerles-${{ github.run_number }}.apk

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Életvezérlés – ${{ github.run_number }}. build
          body: Automatikus build a ${{ github.sha }} változatból. Telefonon nyisd meg ezt az oldalt, és töltsd le az APK-t.
          files: eletvezerles-${{ github.run_number }}.apk
          make_latest: true
